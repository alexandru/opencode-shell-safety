name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun ci
      - run: bun run check
      - run: bun run test
      - name: Install OpenCode for integration tests
        if: github.event_name == 'push' && github.repository == 'alexandru/opencode-shell-safety'
        run: bun install -g --trust @opencode/cli@2.0.12
      - name: Integration tests
        if: github.event_name == 'push' && github.repository == 'alexandru/opencode-shell-safety'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: bun run test:e2e
